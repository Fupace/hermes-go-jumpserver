<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes JumpServer - Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-box { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 40px; width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.login-box h1 { color: #e94560; text-align: center; margin-bottom: 8px; font-size: 28px; }
.login-box p { color: #a0a0b0; text-align: center; margin-bottom: 30px; font-size: 14px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; color: #c0c0d0; margin-bottom: 6px; font-size: 13px; }
.form-group input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.3s; }
.form-group input:focus { border-color: #e94560; }
.btn { width: 100%; padding: 12px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
.btn:hover { background: #d63851; }
.error { color: #ff6b6b; text-align: center; margin-top: 10px; font-size: 13px; display: none; }
</style>
</head>
<body>
<div class="login-box">
<h1>Hermes JumpServer</h1>
<p>Simple SSH Bastion Host</p>
<form id="loginForm">
<div class="form-group"><label>Username</label><input type="text" id="username" value="admin" required></div>
<div class="form-group"><label>Password</label><input type="password" id="password" value="admin" required></div>
<button type="submit" class="btn">Sign In</button>
<div class="error" id="error"></div>
</form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    })
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data.success) {
      window.location.href = '/';
    } else {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = data.message || 'Login failed';
    }
  });
});
</script>
</body>
</html>
