<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes JumpServer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; height: 100vh; }
.sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
.sidebar-header h2 { font-size: 16px; color: #e94560; }
.sidebar-header button { background: #238636; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.sidebar-header button:hover { background: #2ea043; }
.machine-list { flex: 1; overflow-y: auto; padding: 8px; }
.machine-item { padding: 12px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: space-between; }
.machine-item:hover { background: #1c2128; }
.machine-item.active { background: #1f6feb22; border: 1px solid #1f6feb; }
.machine-item .name { font-weight: 600; font-size: 14px; }
.machine-item .host { font-size: 11px; color: #8b949e; }
.machine-actions { display: flex; gap: 4px; }
.machine-actions button { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 14px; padding: 4px; border-radius: 4px; }
.machine-actions button:hover { color: #c9d1d9; background: #30363d; }
.machine-actions .delete:hover { color: #f85149; }
.logout-btn { padding: 12px 16px; border-top: 1px solid #30363d; background: none; border: none; color: #8b949e; cursor: pointer; text-align: left; font-size: 13px; width: 100%; }
.logout-btn:hover { color: #f85149; background: #1c2128; }
.main { flex: 1; display: flex; flex-direction: column; }
.toolbar { padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.toolbar .status { color: #8b949e; }
.toolbar .status.connected { color: #3fb950; }
.terminal-container { flex: 1; padding: 4px; }
.terminal-container .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #484f58; font-size: 18px; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; width: 440px; }
.modal h3 { margin-bottom: 16px; color: #e94560; }
.modal .form-group { margin-bottom: 14px; }
.modal label { display: block; color: #8b949e; font-size: 12px; margin-bottom: 4px; }
.modal input, .modal textarea { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; outline: none; }
.modal input:focus, .modal textarea:focus { border-color: #1f6feb; }
.modal textarea { height: 60px; resize: vertical; font-family: monospace; font-size: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal-actions button { padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; border: none; }
.modal-actions .btn-primary { background: #238636; color: #fff; }
.modal-actions .btn-primary:hover { background: #2ea043; }
.modal-actions .btn-cancel { background: #30363d; color: #c9d1d9; }
.modal-actions .btn-cancel:hover { background: #484f58; }
.error-banner { display: none; background: #da3633; color: #fff; padding: 8px 16px; text-align: center; font-size: 13px; }
</style>
</head>
<body>
<div class="error-banner" id="errorBanner"></div>
<div class="sidebar">
  <div class="sidebar-header">
    <h2>Machines</h2>
    <button id="addBtn">+ Add</button>
  </div>
  <div class="machine-list" id="machineList"></div>
  <button class="logout-btn" id="logoutBtn">Sign Out</button>
</div>
<div class="main">
  <div class="toolbar">
    <span class="status" id="connStatus">No connection</span>
    <span style="flex:1"></span>
    <span id="machineInfo"></span>
  </div>
  <div class="terminal-container" id="terminalContainer">
    <div class="placeholder" id="placeholder">Select a machine from the sidebar to connect</div>
  </div>
</div>

<div class="modal-overlay" id="machineModal">
  <div class="modal">
    <h3 id="modalTitle">Add Machine</h3>
    <form id="machineForm">
      <input type="hidden" id="machineId">
      <div class="form-group"><label>Name *</label><input type="text" id="mName" required placeholder="e.g., web-server-01"></div>
      <div class="form-group"><label>Host *</label><input type="text" id="mHost" required placeholder="192.168.1.100"></div>
      <div class="form-group"><label>Port</label><input type="number" id="mPort" value="22"></div>
      <div class="form-group"><label>Username</label><input type="text" id="mUser" value="root"></div>
      <div class="form-group"><label>Password</label><input type="password" id="mPass" placeholder="Leave empty to use key"></div>
      <div class="form-group"><label>SSH Private Key (base64)</label><textarea id="mKey" placeholder="base64 encoded private key"></textarea></div>
      <div class="form-group"><label>Labels</label><input type="text" id="mLabels" placeholder="prod,web,us-east"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
// Load xterm dynamically - won't block the page if CDN fails
function loadScript(src) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

var currentMachineId = null;
var ws = null;
var term = null;
var fitAddon = null;
var terminalReady = false;

function htmlescape(s) {
  s = s || '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showError(msg) {
  var banner = document.getElementById('errorBanner');
  banner.textContent = msg;
  banner.style.display = 'block';
  setTimeout(function() { banner.style.display = 'none'; }, 5000);
}

// Auth check - runs first, independently
fetch('/api/session').then(function(res) { return res.json(); }).then(function(data) {
  if (!data.authenticated) { window.location.href = '/login'; return; }
  loadMachines();
  loadTerminalLazy();
}).catch(function() {
  window.location.href = '/login';
});

function loadTerminalLazy() {
  loadScript('https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js').then(function() {
    return loadScript('https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js');
  }).then(function() {
    try {
      term = new Terminal({ cursorBlink: true, fontSize: 14, fontFamily: "'Cascadia Code', 'Fira Code', monospace", theme: { background: '#0d1117', foreground: '#c9d1d9' } });
      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('terminalContainer'));
      fitAddon.fit();
      window.addEventListener('resize', function() { if (fitAddon) fitAddon.fit(); });
      terminalReady = true;
    } catch(e) {
      showError('Terminal init failed: ' + e.message);
    }
  }).catch(function() {
    showError('xterm.js CDN unreachable - terminal disabled');
  });
}

function loadMachines() {
  fetch('/api/machines').then(function(res) { return res.json(); }).then(function(machines) {
    var list = document.getElementById('machineList');
    list.innerHTML = '';
    machines.forEach(function(m) {
      var item = document.createElement('div');
      item.className = 'machine-item' + (currentMachineId === m.id ? ' active' : '');
      item.innerHTML = '<div><div class="name">' + htmlescape(m.name) + '</div><div class="host">' + htmlescape(m.host) + ':' + m.port + ' · ' + htmlescape(m.username) + '</div></div><div class="machine-actions"><button class="edit-btn">Edit</button><button class="delete-btn">Del</button></div>';
      
      item.addEventListener('click', function() { connectSSH(m.id); });
      
      item.querySelector('.edit-btn').addEventListener('click', function(e) {
        e.stopPropagation();
        showEditModal(m);
      });
      
      item.querySelector('.delete-btn').addEventListener('click', function(e) {
        e.stopPropagation();
        deleteMachine(m.id);
      });
      
      list.appendChild(item);
    });
  }).catch(function(err) {
    showError('Failed to load machines: ' + err.message);
  });
}

function connectSSH(id) {
  if (!terminalReady) { showError('Terminal not ready - xterm.js may be loading'); return; }
  if (ws) { ws.close(); ws = null; }
  currentMachineId = id;
  loadMachines();
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('connStatus').textContent = 'Connecting...';
  document.getElementById('connStatus').className = 'status';

  fetch('/api/machines/' + id).then(function(res) { return res.json(); }).then(function(m) {
    document.getElementById('machineInfo').textContent = m.name + ' (' + m.host + ':' + m.port + ')';
    term.reset();
    var cols = term.cols, rows = term.rows;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/api/ssh/' + id + '?cols=' + cols + '&rows=' + rows);
    ws.onopen = function() {
      document.getElementById('connStatus').textContent = 'Connected';
      document.getElementById('connStatus').className = 'status connected';
    };
    ws.onmessage = function(e) { term.write(e.data); };
    ws.onclose = function() {
      document.getElementById('connStatus').textContent = 'Disconnected';
      document.getElementById('connStatus').className = 'status';
      currentMachineId = null;
      loadMachines();
    };
    ws.onerror = function() {
      document.getElementById('connStatus').textContent = 'Connection error';
      document.getElementById('connStatus').className = 'status';
    };
    term.onData(function(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'stdin', data: data }));
      }
    });
    term.onResize(function(size) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', data: JSON.stringify({ cols: size.cols, rows: size.rows }) }));
      }
    });
  }).catch(function(err) {
    showError('SSH error: ' + err.message);
  });
}

function showEditModal(m) {
  document.getElementById('modalTitle').textContent = 'Edit Machine';
  document.getElementById('machineId').value = m.id;
  document.getElementById('mName').value = m.name;
  document.getElementById('mHost').value = m.host;
  document.getElementById('mPort').value = m.port;
  document.getElementById('mUser').value = m.username;
  document.getElementById('mPass').value = '';
  document.getElementById('mKey').value = '';
  document.getElementById('mLabels').value = m.labels || '';
  document.getElementById('machineModal').classList.add('show');
}

// Bind UI events
document.getElementById('addBtn').addEventListener('click', function() {
  document.getElementById('modalTitle').textContent = 'Add Machine';
  document.getElementById('machineId').value = '';
  document.getElementById('machineForm').reset();
  document.getElementById('mPort').value = '22';
  document.getElementById('mUser').value = 'root';
  document.getElementById('machineModal').classList.add('show');
});

document.getElementById('cancelBtn').addEventListener('click', function() {
  document.getElementById('machineModal').classList.remove('show');
});

document.getElementById('logoutBtn').addEventListener('click', function() {
  fetch('/api/logout', { method: 'POST' }).then(function() {
    window.location.href = '/login';
  });
});

document.getElementById('machineForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var id = document.getElementById('machineId').value;
  var body = {
    name: document.getElementById('mName').value,
    host: document.getElementById('mHost').value,
    port: parseInt(document.getElementById('mPort').value) || 22,
    username: document.getElementById('mUser').value,
    password: document.getElementById('mPass').value,
    key_file: document.getElementById('mKey').value,
    labels: document.getElementById('mLabels').value
  };
  var method = id ? 'PUT' : 'POST';
  var url = id ? '/api/machines/' + id : '/api/machines';
  fetch(url, { method: method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(function(res) {
      if (res.ok) {
        document.getElementById('machineModal').classList.remove('show');
        loadMachines();
      } else {
        return res.text().then(function(txt) { alert('Failed to save machine: ' + txt); });
      }
    })
    .catch(function(err) { alert('Error: ' + err.message); });
});

function deleteMachine(id) {
  if (!confirm('Delete this machine?')) return;
  fetch('/api/machines/' + id, { method: 'DELETE' }).then(function(res) {
    if (res.ok) {
      if (currentMachineId === id && ws) { ws.close(); }
      loadMachines();
    }
  });
}
</script>
</body>
</html>
